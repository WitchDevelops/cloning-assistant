[project]
name = "backend"
version = "0.1.0"
description = "Molecular cloning screening calculators and 96-well plate map"
readme = "README.md"
authors = [{ name = "WitchDevelops", email = "d.n.wojewska@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["httpx>=0.28.1", "mypy>=2.3.1", "pytest>=9.1.1", "ruff>=0.16.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
